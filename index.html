<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>조교 지원 시스템</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: #f5f5f5; color: #111; min-height: 100vh; }
.top-bar { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1.5rem; background: #fff; border-bottom: 1px solid #e5e5e5; position: sticky; top: 0; z-index: 10; }
.logo { font-size: 15px; font-weight: 600; color: #111; }
.admin-btn { font-size: 12px; color: #666; background: none; border: 1px solid #ddd; padding: 5px 12px; border-radius: 8px; cursor: pointer; }
.admin-btn:hover { background: #f5f5f5; }
.screen { display: none; }
.screen.active { display: block; }

/* 홈 */
.home-wrap { max-width: 480px; margin: 0 auto; padding: 3rem 1.5rem; text-align: center; }
.home-wrap h1 { font-size: 24px; font-weight: 700; margin-bottom: 0.5rem; }
.home-wrap p { font-size: 14px; color: #666; margin-bottom: 2.5rem; }
.card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.type-card { background: #fff; border: 1px solid #e5e5e5; border-radius: 16px; padding: 2rem 1rem; cursor: pointer; transition: all 0.15s; }
.type-card:hover { border-color: #111; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
.type-card .icon { font-size: 36px; margin-bottom: 0.75rem; }
.type-card h2 { font-size: 15px; font-weight: 600; line-height: 1.5; }

/* 폼 */
.form-wrap { max-width: 580px; margin: 0 auto; padding: 2rem 1.5rem; }
.progress-bar { display: flex; gap: 6px; margin-bottom: 1.5rem; }
.step { flex: 1; height: 4px; border-radius: 2px; background: #e5e5e5; }
.step.done { background: #111; }
.form-badge { display: inline-block; font-size: 12px; padding: 3px 12px; border-radius: 20px; background: #e8f0fe; color: #1a56db; margin-bottom: 0.75rem; }
.form-title-row { display: flex; align-items: baseline; gap: 0.5rem; margin-bottom: 1.5rem; }
.form-title-row h2 { font-size: 20px; font-weight: 700; }
.form-title-note { font-size: 12px; color: #aaa; }
.form-group { margin-bottom: 1.25rem; }
.form-group label { font-size: 13px; color: #555; display: block; margin-bottom: 6px; font-weight: 600; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; font-size: 14px; border: 1px solid #ddd; border-radius: 10px; background: #fff; color: #111; outline: none; font-family: inherit; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #111; }
.form-group textarea { resize: vertical; min-height: 100px; line-height: 1.5; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
.gender-row { display: flex; gap: 0.5rem; }
.gender-row select { flex: 1; }
.career-item { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }
.career-item input { flex: 1; }
.career-del { background: none; border: 1px solid #ddd; border-radius: 8px; padding: 0 10px; cursor: pointer; color: #999; font-size: 16px; }
.career-del:hover { background: #fff0f0; border-color: #f00; color: #f00; }
.add-career-btn { width: 100%; padding: 8px; font-size: 13px; color: #1a56db; background: none; border: 1px dashed #93c5fd; border-radius: 10px; cursor: pointer; }
.add-career-btn:hover { background: #eff6ff; }
.nav-btns { display: flex; gap: 0.75rem; margin-top: 2rem; }
.btn-prev { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #ddd; background: none; color: #666; cursor: pointer; font-size: 14px; font-family: inherit; }
.btn-next { flex: 2; padding: 12px; border-radius: 10px; border: none; background: #111; color: #fff; cursor: pointer; font-size: 14px; font-weight: 600; font-family: inherit; }
.btn-prev:hover { background: #f5f5f5; }
.btn-next:hover { background: #333; }

/* 날짜 및 시간 */
.cal-wrap { max-width: 480px; margin: 0 auto; padding: 2rem 1.5rem; }
.date-list { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.5rem; }
.date-option { padding: 1rem 1.25rem; background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; cursor: pointer; font-size: 15px; font-weight: 500; transition: all 0.15s; }
.date-option:hover { border-color: #111; }
.date-option.selected { background: #111; color: #fff; border-color: #111; }
.no-dates { text-align: center; padding: 3rem; color: #aaa; font-size: 14px; }
.time-wrap { max-width: 480px; margin: 0 auto; padding: 2rem 1.5rem; }
.time-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; margin-bottom: 1.5rem; }
.time-btn { padding: 12px 4px; text-align: center; font-size: 14px; border: 1px solid #e5e5e5; border-radius: 10px; cursor: pointer; background: #fff; color: #111; font-family: inherit; }
.time-btn:hover { border-color: #999; }
.time-btn.selected { background: #111; color: #fff; border-color: #111; font-weight: 600; }
.time-btn.taken { background: #f5f5f5; color: #ccc; border-color: #eee; cursor: not-allowed; text-decoration: line-through; }

/* 완료 */
.done-wrap { max-width: 400px; margin: 0 auto; padding: 5rem 1.5rem; text-align: center; }
.done-icon { font-size: 56px; margin-bottom: 1.5rem; }
.done-wrap h2 { font-size: 22px; font-weight: 700; margin-bottom: 0.75rem; }
.done-wrap p { font-size: 13px; color: #aaa; }

/* 관리자 패널 */
.admin-login-wrap { max-width: 340px; margin: 5rem auto; padding: 2rem; background: #fff; border-radius: 16px; border: 1px solid #e5e5e5; }
.admin-login-wrap h2 { font-size: 20px; font-weight: 700; margin-bottom: 1.5rem; text-align: center; }
.admin-login-wrap input { width: 100%; padding: 10px 12px; font-size: 14px; border: 1px solid #ddd; border-radius: 10px; margin-bottom: 0.75rem; outline: none; font-family: inherit; display: block; }
.admin-login-wrap input:focus { border-color: #111; }
.error-msg { font-size: 13px; color: #e00; margin-top: 0.5rem; text-align: center; min-height: 18px; }
.admin-wrap { max-width: 760px; margin: 0 auto; padding: 2rem 1.5rem; }
.admin-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
.admin-header h2 { font-size: 22px; font-weight: 700; }
.admin-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; border-bottom: 1px solid #e5e5e5; }
.admin-tab { padding: 8px 18px; font-size: 14px; border: none; background: none; cursor: pointer; color: #888; font-family: inherit; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.admin-tab.active { color: #111; font-weight: 600; border-bottom-color: #111; }

/* 관리자 - 일정 설정 */
.schedule-section { background: #fff; border: 1px solid #e5e5e5; border-radius: 14px; padding: 1.5rem; margin-bottom: 1rem; }
.schedule-section h3 { font-size: 16px; font-weight: 700; margin-bottom: 1rem; }
.admin-date-row { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 0; border-bottom: 1px solid #f0f0f0; }
.admin-date-row:last-child { border-bottom: none; }
.admin-date-info { font-weight: 600; font-size: 14px; }
.admin-time-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.admin-time-chip { display: flex; align-items: center; gap: 4px; padding: 4px 8px; background: #eee; border-radius: 6px; font-size: 12px; }
.admin-time-chip button { background: none; border: none; color: #999; cursor: pointer; font-size: 12px; }
.admin-time-chip button:hover { color: #f00; }
.time-inputs { display: flex; gap: 4px; margin-top: 6px; }
.time-inputs input { width: 100px; padding: 6px; font-size: 12px; border: 1px solid #ddd; border-radius: 6px; }
.btn-mini { padding: 4px 10px; background: #111; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; }
.btn-del-date { padding: 4px 10px; background: #fef2f2; color: #ef4444; border: 1px solid #fca5a5; border-radius: 6px; cursor: pointer; font-size: 12px; }

/* 관리자 - 지원자 목록 */
.filter-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
.filter-tab { padding: 6px 16px; font-size: 13px; border-radius: 20px; border: 1px solid #ddd; background: none; cursor: pointer; color: #666; font-family: inherit; }
.filter-tab.active { background: #111; color: #fff; border-color: #111; }
.applicant-card { background: #fff; border: 1px solid #e5e5e5; border-radius: 14px; margin-bottom: 0.75rem; overflow: hidden; }
.applicant-card-header { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.25rem; cursor: pointer; }
.applicant-card-header:hover { background: #fafafa; }
.a-left { display: flex; align-items: center; gap: 0.75rem; }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; }
.avatar-qa { background: #e8f0fe; color: #1a56db; }
.avatar-work { background: #dcfce7; color: #16a34a; }
.a-name { font-size: 15px; font-weight: 600; }
.a-meta { font-size: 12px; color: #888; margin-top: 2px; }
.a-badge { font-size: 11px; padding: 4px 12px; border-radius: 20px; }
.badge-qa { background: #e8f0fe; color: #1a56db; }
.badge-work { background: #dcfce7; color: #16a34a; }
.applicant-detail { display: none; padding: 1rem 1.25rem; border-top: 1px solid #f0f0f0; background: #fafafa; }
.applicant-detail.open { display: block; }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem 1.5rem; }
.detail-item .dl { font-size: 12px; color: #999; margin-bottom: 2px; }
.detail-item .dv { font-size: 14px; color: #111; font-weight: 500; }
.detail-full { grid-column: 1 / -1; }
.empty-state { text-align: center; padding: 4rem; color: #aaa; font-size: 14px; }
.loading { text-align: center; padding: 2rem; color: #aaa; font-size: 14px; }
.delete-btn-wrap { margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid #e5e5e5; text-align: right; }
.btn-delete { padding: 6px 14px; font-size: 13px; background: #fef2f2; color: #ef4444; border: 1px solid #fca5a5; border-radius: 6px; cursor: pointer; font-family: inherit; }
.btn-delete:hover { background: #fee2e2; }
</style>
</head>
<body>

<div class="top-bar">
  <span class="logo">🎓 조교 지원 시스템</span>
  <button class="admin-btn" onclick="showScreen('admin-login')">🔒 관리자</button>
</div>

<div class="screen active" id="screen-home">
  <div class="home-wrap">
    <h1>조교 지원</h1>
    <p>지원하실 조교 유형을 선택해주세요</p>
    <div class="card-grid">
      <div class="type-card" onclick="selectType('질의응답조교')">
        <div class="icon">💬</div>
        <h2>질의응답<br>조교 지원</h2>
      </div>
      <div class="type-card" onclick="selectType('업무조교')">
        <div class="icon">💼</div>
        <h2>업무조교<br>지원</h2>
      </div>
    </div>
  </div>
</div>

<div class="screen" id="screen-form">
  <div class="form-wrap">
    <div class="progress-bar">
      <div class="step done"></div>
      <div class="step"></div>
      <div class="step"></div>
    </div>
    <div class="form-badge" id="form-type-badge"></div>
    <div class="form-title-row">
      <h2>기본 정보 입력</h2>
      <span class="form-title-note">(모두 기재해주세요)</span>
    </div>

    <div class="form-row">
      <div class="form-group"><label>이름</label><input type="text" id="f-name" placeholder="홍길동"></div>
      <div class="form-group"><label>나이</label><input type="number" id="f-age" placeholder="24"></div>
    </div>
    <div class="form-group">
      <label>성별</label>
      <div class="gender-row">
        <select id="f-gender" onchange="handleGender()">
          <option value="">선택</option>
          <option value="여성">여성</option>
          <option value="남성">남성</option>
        </select>
        <select id="f-military" style="display:none">
          <option value="">군필 여부</option>
          <option value="군필">군필</option>
          <option value="미필">미필</option>
        </select>
      </div>
    </div>
    <div class="form-group"><label>전화번호</label><input type="tel" id="f-phone" placeholder="010-0000-0000"></div>
    <div class="form-group"><label>거주지</label><input type="text" id="f-address" placeholder="예: 관악구 신림동"></div>
    <div class="form-row">
      <div class="form-group"><label>학교</label><input type="text" id="f-school" placeholder="xx대학교"></div>
      <div class="form-group"><label>학과</label><input type="text" id="f-dept" placeholder="xx학과"></div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>학년</label>
        <select id="f-year">
          <option value="">선택</option>
          <option>1학년</option><option>2학년</option><option>3학년</option>
          <option>4학년</option><option>5학년</option><option>6학년</option>
          <option>대학원생</option>
        </select>
      </div>
      <div class="form-group"><label>근무가능기간</label><input type="text" id="f-period" placeholder="6개월 이상"></div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>엑셀(Excel) 함수 활용 여부</label>
        <select id="f-excel">
          <option value="">선택</option>
          <option value="가능 (함수 읽고 활용 가능)">가능 (함수 읽고 활용 가능)</option>
          <option value="불가능 (기본 데이터 입력만 가능)">불가능 (기본 데이터 입력만 가능)</option>
        </select>
      </div>
      <div class="form-group">
        <label>한글(HWP) 및 수식편집기 사용</label>
        <select id="f-hwp">
          <option value="">선택</option>
          <option value="능숙 (수식편집기 및 문서 편집 능숙)">능숙 (수식편집기 및 문서 편집 능숙)</option>
          <option value="보통 (기본 문서 작성 및 간단한 수식 가능)">보통 (기본 문서 작성 및 간단한 수식 가능)</option>
          <option value="기본 (수식편집 불가, 타이핑만 가능)">기본 (수식편집 불가, 타이핑만 가능)</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>경력 사항</label>
      <div id="career-list">
        <div class="career-item">
          <input type="text" placeholder="예: xx학원 수학 조교 (2025.01~2025.06)">
          <button class="career-del" onclick="removeCareer(this)">✕</button>
        </div>
      </div>
      <button class="add-career-btn" onclick="addCareer()">+ 항목 추가</button>
    </div>

    <div class="form-group">
      <label>자기소개 및 본인 어필 (자유 기재)</label>
      <textarea id="f-intro" placeholder="책임감, 꼼꼼함 등 조교 업무에 적합한 본인의 강점을 자유롭게 어필해 주세요."></textarea>
    </div>

    <div class="nav-btns">
      <button class="btn-prev" onclick="showScreen('home')">이전</button>
      <button class="btn-next" onclick="goDate()">다음</button>
    </div>
  </div>
</div>

<div class="screen" id="screen-date">
  <div class="cal-wrap">
    <div class="progress-bar">
      <div class="step done"></div>
      <div class="step done"></div>
      <div class="step"></div>
    </div>
    <div class="form-badge" id="date-type-badge"></div>
    <h2 style="font-size:20px;font-weight:700;margin-bottom:1.5rem">면접 날짜 선택</h2>
    <div id="date-list" class="date-list"></div>
    <div class="nav-btns">
      <button class="btn-prev" onclick="showScreen('form')">이전</button>
      <button class="btn-next" onclick="goTime()">다음</button>
    </div>
  </div>
</div>

<div class="screen" id="screen-time">
  <div class="time-wrap">
    <div class="progress-bar">
      <div class="step done"></div>
      <div class="step done"></div>
      <div class="step done"></div>
    </div>
    <div class="form-badge" id="time-type-badge"></div>
    <h2 style="font-size:20px;font-weight:700;margin-bottom:0.5rem">면접 시간 선택</h2>
    <p style="font-size:13px;color:#aaa;margin-bottom:1.5rem">시간별 1명 선착순 · 취소선은 마감</p>
    <div class="time-grid" id="time-grid"></div>
    <div class="nav-btns">
      <button class="btn-prev" onclick="showScreen('date')">이전</button>
      <button class="btn-next" onclick="submitApp()">제출하기</button>
    </div>
  </div>
</div>

<div class="screen" id="screen-done">
  <div class="done-wrap">
    <div class="done-icon">✅</div>
    <h2>지원해주셔서 감사합니다.</h2>
    <p style="color: #888; font-size: 13px;">문제가 있을 시 다시 연락드립니다.</p>
    <div class="nav-btns" style="margin-top:2rem;max-width:200px;margin-left:auto;margin-right:auto">
      <button class="btn-next" onclick="resetAndHome()">처음으로</button>
    </div>
  </div>
</div>

<div class="screen" id="screen-admin-login">
  <div class="admin-login-wrap">
    <h2>🔒 관리자 로그인</h2>
    <input type="password" id="admin-pw" placeholder="비밀번호" onkeydown="if(event.key==='Enter')checkAdmin()">
    <button class="btn-next" style="width:100%;flex:none" onclick="checkAdmin()">로그인</button>
    <div class="error-msg" id="admin-error"></div>
    <div style="margin-top:0.75rem">
      <button class="btn-prev" style="width:100%" onclick="showScreen('home')">돌아가기</button>
    </div>
  </div>
</div>

<div class="screen" id="screen-admin">
  <div class="admin-wrap">
    <div class="admin-header">
      <h2>관리자 페이지</h2>
      <button class="admin-btn" onclick="showScreen('home')">✕ 나가기</button>
    </div>
    <div class="admin-tabs">
      <button class="admin-tab active" onclick="switchAdminTab('applicants', this)">지원자 목록</button>
      <button class="admin-tab" onclick="switchAdminTab('schedule', this)">일정 설정</button>
    </div>

    <div id="tab-applicants">
      <div class="filter-tabs">
        <button class="filter-tab active" onclick="filterApp('all',this)">전체</button>
        <button class="filter-tab" onclick="filterApp('질의응답조교',this)">질의응답조교</button>
        <button class="filter-tab" onclick="filterApp('업무조교',this)">업무조교</button>
      </div>
      <div id="applicant-list"></div>
    </div>

    <div id="tab-schedule" style="display:none">
      <div class="schedule-section">
        <h3>📅 면접 날짜 및 시간 추가</h3>
        <div class="date-add-row" style="margin-top:1rem;">
          <input type="date" id="admin-date-input">
          <button class="btn-add" onclick="addAdminDate()">날짜 추가</button>
        </div>
        <div id="admin-schedule-list" style="margin-top:1rem;">
          </div>
        <button class="save-schedule-btn" onclick="saveSchedule()">전체 일정 저장하기</button>
        <div class="save-msg" id="save-msg"></div>
      </div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://iawrbhjyzxacteurukfa.supabase.co';
const SUPABASE_KEY = 'sb_publishable_AiHTjZGSf6HF4BqjSB42bg_aEMeV6yH';
const ADMIN_PASSWORD = 'admin1234';

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentType = '';
let selectedDate = null;
let selectedTime = null;
let allApplications = [];

// 날짜별 개별 시간을 저장할 구조 체계
let masterSchedule = {};

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
  window.scrollTo(0, 0);
}

function selectType(type) {
  currentType = type;
  document.getElementById('form-type-badge').textContent = type;
  document.getElementById('date-type-badge').textContent = type;
  document.getElementById('time-type-badge').textContent = type;
  showScreen('form');
}

function handleGender() {
  const g = document.getElementById('f-gender').value;
  document.getElementById('f-military').style.display = g === '남성' ? 'block' : 'none';
}

function addCareer() {
  const list = document.getElementById('career-list');
  const div = document.createElement('div');
  div.className = 'career-item';
  div.innerHTML = '<input type="text" placeholder="경력을 입력해주세요"><button class="career-del" onclick="removeCareer(this)">✕</button>';
  list.appendChild(div);
}

function removeCareer(btn) {
  const list = document.getElementById('career-list');
  if (list.children.length > 1) btn.parentElement.remove();
  else btn.previousElementSibling.value = '';
}

// 날짜 리스트 표출
async function goDate() {
  showScreen('date');
  const dateList = document.getElementById('date-list');
  dateList.innerHTML = '<div class="loading">날짜 불러오는 중...</div>';
  
  try {
    const { data, error } = await db.from('schedule').select('*').eq('key', 'master').single();
    masterSchedule = (data && data.value) ? JSON.parse(data.value) : {};

    const dates = Object.keys(masterSchedule).filter(d => masterSchedule[d].length > 0);
    if (dates.length === 0) {
      dateList.innerHTML = '<div class="no-dates">📭 면접 일정이 존재하지 않습니다.</div>';
      return;
    }
    selectedDate = null;
    dateList.innerHTML = '';
    dates.sort().forEach(d => {
      const el = document.createElement('div');
      el.className = 'date-option';
      el.textContent = formatDateKor(d);
      el.onclick = () => {
        document.querySelectorAll('.date-option').forEach(x => x.classList.remove('selected'));
        el.classList.add('selected');
        selectedDate = d;
      };
      dateList.appendChild(el);
    });
  } catch (err) {
    dateList.innerHTML = '<div class="no-dates">데이터베이스 연결 실패</div>';
  }
}

function formatDateKor(d) {
  const parts = d.split('-');
  return parts[0] + '년 ' + parseInt(parts[1]) + '월 ' + parseInt(parts[2]) + '일';
}

// 시간 리스트 표출 (선착순 차단 반영)
async function goTime() {
  if (!selectedDate) { alert('날짜를 선택해주세요.'); return; }
  showScreen('time');
  const grid = document.getElementById('time-grid');
  grid.innerHTML = '<div class="loading" style="grid-column:1/-1">시간 불러오는 중...</div>';

  try {
    const { data: bookedData } = await db.from('applications').select('time').eq('date', selectedDate);
    const booked = new Set((bookedData || []).map(r => r.time));
    const times = masterSchedule[selectedDate] || [];

    if (times.length === 0) {
      grid.innerHTML = '<div class="no-dates" style="grid-column:1/-1">선택할 수 있는 시간이 없습니다.</div>';
      return;
    }

    selectedTime = null;
    grid.innerHTML = '';
    times.sort().forEach(t => {
      const btn = document.createElement('button');
      btn.className = 'time-btn';
      btn.textContent = t;
      if (booked.has(t)) {
        btn.classList.add('taken');
        btn.disabled = true;
      } else {
        btn.onclick = () => {
          document.querySelectorAll('.time-btn:not(.taken)').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          selectedTime = t;
        };
      }
      grid.appendChild(btn);
    });
  } catch (err) {
    grid.innerHTML = '<div class="no-dates" style="grid-column:1/-1">시간 조회 에러</div>';
  }
}

// 최종 지원서 제출
async function submitApp() {
  if (!selectedTime) { alert('시간을 선택해주세요.'); return; }

  try {
    const { data: already } = await db.from('applications').select('id').eq('date', selectedDate).eq('time', selectedTime);
    if (already && already.length > 0) {
      alert('방금 다른 지원자가 해당 타임을 선점했습니다. 다른 시간을 선택해주세요.');
      goTime();
      return;
    }

    const careers = Array.from(document.querySelectorAll('#career-list .career-item input'))
      .map(i => i.value.trim()).filter(v => v).join(' / ');
    const gender = document.getElementById('f-gender').value;
    const military = gender === '남성' ? document.getElementById('f-military').value : '';

    const data = {
      type: currentType,
      name: document.getElementById('f-name').value || '',
      age: document.getElementById('f-age').value || '',
      gender: gender + (military ? ' / ' + military : ''),
      phone: document.getElementById('f-phone').value || '',
      address: document.getElementById('f-address').value || '',
      school: document.getElementById('f-school').value || '',
      dept: document.getElementById('f-dept').value || '',
      year: document.getElementById('f-year').value || '',
      period: document.getElementById('f-period').value || '',
      careers: careers,
      excel_exp: document.getElementById('f-excel').value || '',
      hwp_exp: document.getElementById('f-hwp').value || '',
      license_any: '', // 더이상 화면에서 수집 안함 (DB 구조 유지를 위해 빈칸 전달)
      formula_exp: '', // 더이상 화면에서 수집 안함 (DB 구조 유지를 위해 빈칸 전달)
      self_intro: document.getElementById('f-intro').value || '',
      date: selectedDate,
      time: selectedTime
    };

    const { error } = await db.from('applications').insert([data]);
    if (error) { alert('저장 실패: ' + error.message); return; }
    showScreen('done');
  } catch (err) {
    alert('오류 발생: ' + err.message);
  }
}

function resetAndHome() {
  ['f-name','f-age','f-phone','f-address','f-school','f-dept','f-period','f-intro'].forEach(id => document.getElementById(id).value = '');
  ['f-gender','f-year','f-excel','f-hwp'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-military').style.display = 'none';
  document.getElementById('career-list').innerHTML = '<div class="career-item"><input type="text" placeholder="예: xx학원 조교"><button class="career-del" onclick="removeCareer(this)">✕</button></div>';
  selectedDate = null; selectedTime = null;
  showScreen('home');
}

// 관리자 진입 인증
function checkAdmin() {
  const pw = document.getElementById('admin-pw').value;
  if (pw === ADMIN_PASSWORD) {
    document.getElementById('admin-pw').value = '';
    document.getElementById('admin-error').textContent = '';
    loadApplicants();
    loadScheduleForAdmin();
    showScreen('admin');
  } else {
    document.getElementById('admin-error').textContent = '비밀번호가 올바르지 않습니다.';
  }
}

function switchAdminTab(tab, btn) {
  document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-applicants').style.display = tab === 'applicants' ? 'block' : 'none';
  document.getElementById('tab-schedule').style.display = tab === 'schedule' ? 'block' : 'none';
}

/* 관리자 시스템 - 날짜별 개별 시간 설정 설계 로직 */
async function loadScheduleForAdmin() {
  try {
    const { data } = await db.from('schedule').select('*').eq('key', 'master').single();
    masterSchedule = (data && data.value) ? JSON.parse(data.value) : {};
    renderAdminScheduleView();
  } catch (err) {
    masterSchedule = {};
  }
}

function renderAdminScheduleView() {
  const container = document.getElementById('admin-schedule-list');
  container.innerHTML = '';
  
  const dates = Object.keys(masterSchedule).sort();
  if (dates.length === 0) {
    container.innerHTML = '<div style="color:#aaa; text-align:center; padding:1rem;">추가된 면접 날짜가 없습니다. 위의 달력에서 날짜를 지정해 추가해 주세요.</div>';
    return;
  }

  dates.forEach(d => {
    const row = document.createElement('div');
    row.className = 'schedule-section';
    row.style.border = '1px solid #ddd';
    row.style.padding = '1rem';
    
    let chipsHtml = (masterSchedule[d] || []).sort().map(t => `
      <div class="admin-time-chip">
        <span>${t}</span>
        <button onclick="removeAdminTime('${d}', '${t}')">✕</button>
      </div>
    `).join('');

    row.innerHTML = `
      <div class="admin-date-row">
        <div class="admin-date-info">📅 ${formatDateKor(d)}</div>
        <button class="btn-del-date" onclick="removeAdminDate('${d}')">날짜 삭제</button>
      </div>
      <div class="admin-time-chips">${chipsHtml || '<span style="color:#bbb; font-size:12px;">등록된 타임 없음</span>'}</div>
      <div class="time-inputs">
        <input type="time" id="time-input-${d}">
        <button class="btn-mini" onclick="addAdminTime('${d}')">⏱️ 시간 추가</button>
      </div>
    `;
    container.appendChild(row);
  });
}

function addAdminDate() {
  const val = document.getElementById('admin-date-input').value;
  if (!val) { alert('날짜를 고르세요.'); return; }
  if (masterSchedule[val]) { alert('이미 목록에 존재하는 날짜입니다.'); return; }
  masterSchedule[val] = [];
  renderAdminScheduleView();
  document.getElementById('admin-date-input').value = '';
}

function removeAdminDate(d) {
  if (confirm('이 날짜와 설정된 모든 시간대를 통째로 삭제할까요?')) {
    delete masterSchedule[d];
    renderAdminScheduleView();
  }
}

function addAdminTime(d) {
  const val = document.getElementById(`time-input-${d}`).value;
  if (!val) { alert('시간을 지정해 주세요.'); return; }
  if (masterSchedule[d].includes(val)) { alert('이미 등록된 시간대입니다.'); return; }
  masterSchedule[d].push(val);
  renderAdminScheduleView();
}

function removeAdminTime(d, t) {
  masterSchedule[d] = masterSchedule[d].filter(x => x !== t);
  renderAdminScheduleView();
}

async function saveSchedule() {
  const btn = document.querySelector('.save-schedule-btn');
  btn.textContent = '데이터 저장 중...';
  btn.disabled = true;

  try {
    await db.from('schedule').upsert([{ key: 'master', value: JSON.stringify(masterSchedule) }], { onConflict: 'key' });
    document.getElementById('save-msg').textContent = '✓ 전체 날짜별 시간 세팅이 DB에 정상 적용되었습니다!';
    setTimeout(() => document.getElementById('save-msg').textContent = '', 3000);
  } catch (err) {
    alert('저장 실패: ' + err.message);
  }
  btn.textContent = '전체 일정 저장하기';
  btn.disabled = false;
}

// 지원자 현황 조회
async function loadApplicants() {
  document.getElementById('applicant-list').innerHTML = '<div class="loading">지원 정보 수집 중...</div>';
  try {
    const { data } = await db.from('applications').select('*').order('created_at', { ascending: false });
    allApplications = data || [];
    renderApplicants('all');
  } catch (err) {
    document.getElementById('applicant-list').innerHTML = '<div class="empty-state">로드 실패</div>';
  }
}

async function deleteApplicant(id) {
  if (!confirm('해당 지원 정보를 데이터베이스에서 영구 삭제하시겠습니까?')) return;
  await db.from('applications').delete().eq('id', id);
  loadApplicants();
}

function filterApp(type, btn) {
  document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  renderApplicants(type);
}

// 대시보드 구조 내 상세 검증 내용 표현
function renderApplicants(filter) {
  const list = document.getElementById('applicant-list');
  const filtered = filter === 'all' ? allApplications : allApplications.filter(a => a.type === filter);
  if (filtered.length === 0) { list.innerHTML = '<div class="empty-state">📭 접수된 지원서가 없습니다.</div>'; return; }
  list.innerHTML = '';
  
  filtered.forEach(app => {
    const isQA = app.type === '질의응답조교';
    const initials = (app.name || '?').slice(-2);
    const dateLabel = app.date ? formatDateKor(app.date) : '';
    const card = document.createElement('div');
    card.className = 'applicant-card';
    card.innerHTML = `
      <div class="applicant-card-header" onclick="toggleDetail(this)">
        <div class="a-left">
          <div class="avatar ${isQA ? 'avatar-qa' : 'avatar-work'}">${initials}</div>
          <div>
            <div class="a-name">${app.name || '(미입력)'}</div>
            <div class="a-meta">${app.school||''} ${app.dept||''} ${app.year||''} · ${dateLabel} ${app.time||''}</div>
          </div>
        </div>
        <span class="a-badge ${isQA ? 'badge-qa' : 'badge-work'}">${app.type}</span>
      </div>
      <div class="applicant-detail">
        <div class="detail-grid">
          <div class="detail-item"><div class="dl">나이</div><div class="dv">${app.age||'-'}세</div></div>
          <div class="detail-item"><div class="dl">성별/병역</div><div class="dv">${app.gender||'-'}</div></div>
          <div class="detail-item"><div class="dl">전화번호</div><div class="dv">${app.phone||'-'}</div></div>
          <div class="detail-item"><div class="dl">거주지역</div><div class="dv">${app.address||'-'}</div></div>
          <div class="detail-item"><div class="dl">근무가능기간</div><div class="dv">${app.period||'-'}</div></div>
          <div class="detail-item"><div class="dl">확정 면접일시</div><div class="dv" style="color:#1a56db;">${dateLabel} ${app.time||''}</div></div>
          
          <div class="detail-item"><div class="dl">엑셀 함수 활용 여부</div><div class="dv">${app.excel_exp||'-'}</div></div>
          <div class="detail-item"><div class="dl">한글 및 수식편집기</div><div class="dv">${app.hwp_exp||'-'}</div></div>
          
          ${app.careers ? `<div class="detail-item detail-full"><div class="dl">과거 수행 경력</div><div class="dv">${app.careers}</div></div>` : ''}
          ${app.self_intro ? `<div class="detail-item detail-full" style="background:#fff; padding:8px; border-radius:6px; border:1px solid #eee; margin-top:5px;"><div class="dl" style="color:#111; font-weight:bold;">✨ 지원자 한줄 어필 및 자기소개</div><div class="dv" style="white-space:pre-wrap; font-size:13px; margin-top:4px;">${app.self_intro}</div></div>` : ''}
        </div>
        <div class="delete-btn-wrap">
          <button class="btn-delete" onclick="deleteApplicant('${app.id}')">지원서 영구 삭제</button>
        </div>
      </div>`;
    list.appendChild(card);
  });
}

function toggleDetail(header) {
  header.nextElementSibling.classList.toggle('open');
}
</script>
